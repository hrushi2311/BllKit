name: Build, Test & Publish BllKit

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore BllKit/BllKit.csproj
      - run: dotnet build BllKit/BllKit.csproj --no-restore -c Release
      - run: dotnet run --project TestRunner/TestRunner.csproj -c Release

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore BllKit/BllKit.csproj
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Update version in csproj
        run: sed -i "s|<Version>.*</Version>|<Version>${{ steps.version.outputs.VERSION }}</Version>|" BllKit/BllKit.csproj
      - run: dotnet build BllKit/BllKit.csproj --no-restore -c Release
      - run: dotnet pack BllKit/BllKit.csproj --no-build -c Release -o ./nupkg
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: actions/upload-artifact@v4
        with:
          name: BllKit-${{ steps.version.outputs.VERSION }}
          path: ./nupkg/*.nupkg
